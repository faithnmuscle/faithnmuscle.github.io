// ---- CSV parser ----
function parseCSVRow(line) {
  const result = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      inQuotes = !inQuotes;
    } else if (ch === ',' && !inQuotes) {
      result.push(current);
      current = '';
    } else {
      current += ch;
    }
  }
  result.push(current);
  return result;
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = parseCSVRow(lines[0]);
  return lines.slice(1).map(line => {
    const vals = parseCSVRow(line);
    const obj = {};
    headers.forEach((h, i) => obj[h.trim()] = (vals[i] || '').trim());
    return obj;
  });
}

function toLogDate(str) {
  // "Apr 24, 2026, 8:09 AM" -> "2026-04-24"
  const d = new Date(str);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function durationMin(start, end) {
  return Math.round((new Date(end) - new Date(start)) / 60000);
}

function buildSessions(rows) {
  const sessionMap = new Map();
  rows.forEach(r => {
    const key = r.title + '||' + r.start_time;
    if (!sessionMap.has(key)) {
      sessionMap.set(key, {
        key,
        name: r.title,
        date: toLogDate(r.start_time),
        durationMin: durationMin(r.start_time, r.end_time),
        exerciseRows: [],
      });
    }
    sessionMap.get(key).exerciseRows.push(r);
  });

  const sessions = [];
  sessionMap.forEach(s => {
    // Group exercise rows by exercise_title (preserving order of first appearance)
    const exMap = new Map();
    const exOrder = [];
    s.exerciseRows.forEach(r => {
      if (!exMap.has(r.exercise_title)) {
        exMap.set(r.exercise_title, []);
        exOrder.push(r.exercise_title);
      }
      exMap.get(r.exercise_title).push(r);
    });

    const exercises = [];
    exOrder.forEach((exName, i) => {
      const sets = exMap.get(exName);
      const notes = sets.map(s => s.exercise_notes).filter(Boolean).join('; ') || null;
      sets.forEach(r => {
        exercises.push({
          exercise_name: exName,
          set_index: Number(r.set_index) || 0,
          set_type: r.set_type || 'normal',
          reps: (r.reps !== '' && r.reps != null) ? (Number(r.reps) || null) : null,
          weight_kg: Number(r.weight_kg) || null,
          distance_km: Number(r.distance_km) || null,
          duration_seconds: Number(r.duration_seconds) || null,
          rpe: Number(r.rpe) || null,
          notes,
          sort_order: i,
        });
      });
    });

    sessions.push({ name: s.name, date: s.date, durationMin: s.durationMin, exercises });
  });

  // Sort by date desc then by start time (name gives no order, use insertion order)
  return sessions;
}

// ---- Main ----
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');
const btnImport = document.getElementById('btn-import');

function log(msg) {
  logEl.style.display = 'block';
  logEl.textContent += msg + '\n';
}

if (!session) throw new Error('unauthenticated');

const profile = await getProfile();
const plan = await getActivePlan(profile.id);

statusEl.textContent = `Logged in as: ${profile.full_name || profile.email || profile.id}${plan ? ` | Plan: ${plan.plan_type}` : ' | No plan'}`;
btnImport.style.display = 'inline-flex';

const rows = parseCSV(CSV);
const sessions = buildSessions(rows);

btnImport.addEventListener('click', async () => {
  btnImport.disabled = true;
  btnImport.textContent = 'Importing...';
  logEl.textContent = '';

  log(`Found ${sessions.length} sessions in CSV`);

  // Fetch existing log keys (date + session_name)
  const { data: existing, error: fetchErr } = await supabase
    .from('workout_logs')
    .select('log_date, session_name')
    .eq('client_id', profile.id);

  if (fetchErr) {
    log(`ERROR fetching existing logs: ${fetchErr.message}`);
    btnImport.disabled = false;
    btnImport.textContent = 'Import Missing Workouts';
    return;
  }

  const existingKeys = new Set((existing || []).map(l => `${l.log_date}||${l.session_name}`));
  log(`Already in DB: ${existingKeys.size} sessions`);

  let imported = 0;
  let skipped = 0;

  for (const s of sessions) {
    const key = `${s.date}||${s.name}`;
    if (existingKeys.has(key)) {
      log(`SKIP  ${s.date} "${s.name}" (already exists)`);
      skipped++;
      continue;
    }

    const logRow = {
      client_id: profile.id,
      plan_id: plan?.id ?? null,
      log_date: s.date,
      is_rest_day: false,
      session_name: s.name,
      duration_min: s.durationMin || null,
      perceived_effort: null,
      body_weight_kg: null,
      avg_heart_rate_bpm: null,
      overall_notes: null,
    };

    const { data: inserted, error: insertErr } = await supabase
      .from('workout_logs')
      .insert(logRow)
      .select('id')
      .single();

    if (insertErr) {
      log(`ERROR ${s.date} "${s.name}": ${insertErr.message}`);
      continue;
    }

    if (s.exercises.length > 0) {
      const exRows = s.exercises.map(ex => ({ ...ex, log_id: inserted.id }));
      const { error: exErr } = await supabase.from('workout_exercises').insert(exRows);
      if (exErr) {
        log(`ERROR exercises for ${s.date} "${s.name}": ${exErr.message}`);
        continue;
      }
    }

    log(`OK    ${s.date} "${s.name}" (${s.exercises.length} exercises, ${s.durationMin} min)`);
    imported++;
  }

  log(`\nDone. Imported: ${imported}, Skipped: ${skipped}`);
  btnImport.textContent = 'Import Complete';
});
