  <main class="portal-main">
    <div class="portal-topbar">

    <div class="portal-content" id="page-content" style="display:none;">

      <!-- Upload card -->

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:1rem;">

          </div>
        </div>

        <div class="form-group">
          <label for="photo-file">Photo (JPEG, PNG, HEIC - max 5MB)</label>
          <input type="file" id="photo-file" accept="image/*" style="padding:0.4rem;"/>
        </div>

        <div id="photo-preview" style="display:none; margin-bottom:1rem; display:flex; align-items:flex-start; gap:1rem;">
          <img id="preview-img" style="width:100px; height:100px; object-fit:cover; border-radius:8px; border:1px solid var(--border);"/>
          <div>
            <div id="preview-original" style="font-size:0.8rem; color:var(--muted);"></div>
            <div id="preview-compressed" style="font-size:0.8rem; color:var(--blue-light);"></div>
          </div>
        </div>

        <button class="btn btn-primary" id="btn-upload" disabled>
          <span class="btn-spinner"></span><span class="btn-text">Upload Photo</span>
        </button>
      </div>

      <!-- Gallery card -->
      <div class="card">
        <div class="card-header"><div class="card-title">My Photos</div></div>
        <div id="photos-gallery">
          <div style="color:var(--muted); font-size:0.875rem;">Loading...</div>
        </div>
      </div>

    </div>

</div>

<script type="module">
import { supabase } from '/assets/supabase-client.js';
import { requireAuth, initSidebar, getProfile, getActivePlan, escapeHtml, setBusy, toast, localCalendarDate } from '/assets/portal.js';

const session = await requireAuth();
if (!session) throw new Error('unauthenticated');
await initSidebar();
const profile = await getProfile();
const plan    = await getActivePlan(profile.id);

document.getElementById('page-content').style.display = 'block';

// Default date to today
const dateInput = document.getElementById('photo-date');
dateInput.value  = localCalendarDate();

let compressedBlob = null;
let token = session.access_token;

// ── Quota ─────────────────────────────────────────────────────────────────
async function loadQuota(forDate) {
  const monthStart = forDate.slice(0, 7) + '-01';
  const nextMonth  = new Date(forDate.slice(0, 7) + '-01');
  nextMonth.setMonth(nextMonth.getMonth() + 1);
  const monthEnd = nextMonth.toISOString().split('T')[0];

  const [dateRes, monthRes] = await Promise.all([
    supabase.from('progress_photos').select('id', { count: 'exact', head: true })
      .eq('client_id', profile.id).eq('photo_date', forDate),
    supabase.from('progress_photos').select('photo_date')
      .eq('client_id', profile.id).gte('photo_date', monthStart).lt('photo_date', monthEnd),
  ]);

  const dateCount = dateRes.count || 0;
  const monthDates = new Set((monthRes.data || []).map(r => r.photo_date));
  const monthCount = monthDates.size;
  const thisDateInMonth = monthDates.has(forDate);
  const monthQuotaUsed = !thisDateInMonth && monthCount >= 2;

  const dateOk  = dateCount < 3;
  const monthOk = thisDateInMonth || monthCount < 2;
  const canUpload = dateOk && monthOk;

  document.getElementById('quota-text').textContent =
    `${dateCount}/3 photos this date · ${monthCount}/2 upload dates this month`;

  document.getElementById('btn-upload').disabled = !canUpload || !compressedBlob;

  if (!dateOk) showAlert('Max 3 photos for this date already uploaded.', 'error');
  else if (!monthOk) showAlert('Max 2 upload dates per month reached. Choose one of your existing dates this month.', 'error');
  else hideAlert();

  return canUpload;
}

dateInput.addEventListener('change', () => loadQuota(dateInput.value));
loadQuota(dateInput.value);

// ── Image compression ──────────────────────────────────────────────────────
async function compressImage(file) {
  if (file.size > 5 * 1024 * 1024) throw new Error('Photo must be under 5MB');
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const MAX = 1080;
        let { width: w, height: h } = img;
        if (w > MAX || h > MAX) {
          if (w >= h) { h = Math.round(h * MAX / w); w = MAX; }
          else        { w = Math.round(w * MAX / h); h = MAX; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(b => b ? resolve(b) : reject(new Error('Compression failed')), 'image/jpeg', 0.82);
      };
      img.onerror = () => reject(new Error('Could not read image'));
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function fmtSize(bytes) {
  return bytes < 1024 * 1024
    ? (bytes / 1024).toFixed(0) + ' KB'
    : (bytes / 1024 / 1024).toFixed(1) + ' MB';
}

document.getElementById('photo-file').addEventListener('change', async e => {
  const file = e.target.files?.[0];
  if (!file) { compressedBlob = null; document.getElementById('photo-preview').style.display = 'none'; return; }

  compressedBlob = null;
  document.getElementById('btn-upload').disabled = true;
  hideAlert();

  try {
    const blob = await compressImage(file);
    compressedBlob = blob;
    const url = URL.createObjectURL(blob);
    document.getElementById('preview-img').src = url;
    document.getElementById('preview-original').textContent   = 'Original: ' + fmtSize(file.size);
    document.getElementById('preview-compressed').textContent = 'Compressed: ' + fmtSize(blob.size);
    document.getElementById('photo-preview').style.display    = 'flex';
    const canUpload = await loadQuota(dateInput.value);
    document.getElementById('btn-upload').disabled = !canUpload;
  } catch (err) {
    showAlert(err.message, 'error');
    document.getElementById('photo-preview').style.display = 'none';
  }
});

// ── Upload ─────────────────────────────────────────────────────────────────
document.getElementById('btn-upload').addEventListener('click', async () => {
  if (!compressedBlob) return;
  const canUpload = await loadQuota(dateInput.value);
  if (!canUpload) return;

  const btn = document.getElementById('btn-upload');
  setBusy(btn, true);
  hideAlert();

  // Refresh token in case it expired
  const { data: { session: s } } = await supabase.auth.getSession();
  token = s?.access_token;

  const fd = new FormData();
  fd.append('file', compressedBlob, 'photo.jpg');
  fd.append('photo_date', dateInput.value);
  fd.append('angle',      document.getElementById('photo-angle').value);
  if (plan?.id) fd.append('plan_id', plan.id);

  const res = await fetch('/api/upload-photo', {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${token}` },
    body: fd,
  });
  const data = await res.json();

  setBusy(btn, false);

  if (!res.ok) {
    showAlert(data.error || 'Upload failed', 'error');
  } else {
    toast('Photo uploaded!', 'success');
    compressedBlob = null;
    document.getElementById('photo-file').value = '';
    document.getElementById('photo-preview').style.display = 'none';
    document.getElementById('btn-upload').disabled = true;
    await loadQuota(dateInput.value);
    await loadGallery();
  }
});

// ── Gallery ────────────────────────────────────────────────────────────────
async function loadGallery() {
  const gallery = document.getElementById('photos-gallery');
  gallery.innerHTML = '<div style="color:var(--muted); font-size:0.875rem;">Loading...</div>';

  const { data: photos } = await supabase
    .from('progress_photos')
    .select('id, photo_date, angle, notes, created_at')
    .eq('client_id', profile.id)
    .order('photo_date', { ascending: false })
    .order('created_at', { ascending: true });

  if (!photos?.length) {
    gallery.innerHTML = '<div style="color:var(--muted); font-size:0.875rem;">No photos yet. Upload your first progress photo above.</div>';
    return;
  }

  // Group by date
  const byDate = {};
  photos.forEach(p => {
    if (!byDate[p.photo_date]) byDate[p.photo_date] = [];
    byDate[p.photo_date].push(p);
  });

  // Refresh token
  const { data: { session: s } } = await supabase.auth.getSession();
  const t = s?.access_token;

  gallery.innerHTML = '';

  for (const date of Object.keys(byDate)) {
    const group = byDate[date];
    const dateLabel = new Date(date + 'T12:00:00').toLocaleDateString('en-GB', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
    });

    const groupEl = document.createElement('div');
    groupEl.style.cssText = 'margin-bottom:1.5rem;';
    groupEl.innerHTML = `
      <div style="font-size:0.8rem; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--muted); margin-bottom:0.75rem; padding-bottom:0.5rem; border-bottom:1px solid var(--border);">${escapeHtml(dateLabel)}</div>
      <div class="photo-row" style="display:flex; gap:0.75rem; flex-wrap:wrap;"></div>
    `;
    gallery.appendChild(groupEl);
    const row = groupEl.querySelector('.photo-row');

    // Load each photo in parallel
    await Promise.all(group.map(async photo => {
      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:relative; display:inline-block;';
      wrap.innerHTML = `
        <div style="width:110px; height:110px; background:var(--bg2); border:1px solid var(--border); border-radius:10px; display:flex; align-items:center; justify-content:center;">
          <span style="color:var(--muted); font-size:0.7rem;">Loading...</span>
        </div>
      `;
      row.appendChild(wrap);

      try {
        const resp = await fetch(`/api/photo?photo_id=${photo.id}`, {
          headers: { 'Authorization': `Bearer ${t}` }
        });
        if (resp.ok) {
          const blob = await resp.blob();
          const url  = URL.createObjectURL(blob);
          wrap.innerHTML = `
            <div style="position:relative;">
              <img src="${url}" style="width:110px; height:110px; object-fit:cover; border-radius:10px; border:1px solid var(--border); display:block;" loading="lazy"/>
              <div style="position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,0.55); color:#fff; font-size:0.7rem; text-align:center; border-radius:0 0 10px 10px; padding:0.2rem 0.3rem; text-transform:capitalize;">
                ${escapeHtml(photo.angle)}
              </div>
              <button class="btn-icon-delete btn-del-photo" data-id="${escapeHtml(photo.id)}" title="Delete" style="position:absolute; top:4px; right:4px; background:rgba(0,0,0,0.6); border:none; cursor:pointer; padding:0.2rem 0.35rem; color:#f87171; font-size:1rem; line-height:1; border-radius:4px;">&times;</button>
            </div>
          `;
          wrap.querySelector('.btn-del-photo').addEventListener('click', () => deletePhoto(photo.id));
        } else {
          wrap.innerHTML = `<div style="width:110px; height:110px; background:var(--bg2); border:1px solid var(--border); border-radius:10px; display:flex; align-items:center; justify-content:center;"><span style="color:#ef4444; font-size:0.7rem;">Error</span></div>`;
        }
      } catch {
        wrap.innerHTML = `<div style="width:110px; height:110px; background:var(--bg2); border:1px solid var(--border); border-radius:10px; display:flex; align-items:center; justify-content:center;"><span style="color:#ef4444; font-size:0.7rem;">Error</span></div>`;
      }
    }));
  }
}

// ── Delete photo ────────────────────────────────────────────────────────────
async function deletePhoto(photoId) {
  if (!confirm('Delete this photo? This cannot be undone.')) return;
  const { data: { session: s } } = await supabase.auth.getSession();
  const t = s?.access_token;
  const res = await fetch(`/api/photo?photo_id=${photoId}`, {
    method: 'DELETE',
    headers: { 'Authorization': `Bearer ${t}` },
  });
  if (res.ok) {
    toast('Photo deleted', 'success');
    await loadQuota(dateInput.value);
    await loadGallery();
  } else {
    const d = await res.json().catch(() => ({}));
    toast(d.error || 'Delete failed', 'error');
  }
}

// ── Helpers ────────────────────────────────────────────────────────────────
function showAlert(msg, type = 'error') {
  const el = document.getElementById('upload-alert');
  el.className = 'alert alert-' + (type === 'error' ? 'error' : 'success');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideAlert() {
  document.getElementById('upload-alert').style.display = 'none';
}

loadGallery();
</script>
