<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password | Faith n Muscle Portal</title>
  <link rel="stylesheet" href="/assets/portal.css"/>
  <meta name="robots" content="noindex"/>
</head>
<body class="auth-page">

<div class="auth-card">
  <div class="auth-logo">
    <h1>Faith n Muscle</h1>
    <p>Reset your password</p>
  </div>

  <!-- Step 1: request reset email -->
  <div id="step-request">
    <p style="color:var(--muted); font-size:0.875rem; margin-bottom:1.5rem;">
      Enter your email and we'll send you a reset link valid for 1 hour.
    </p>
    <div id="alert-request" class="alert" style="display:none"></div>
    <form id="request-form" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required/>
        <div class="form-error" id="email-error"></div>
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="btn-request">
        <span class="btn-spinner"></span>
        <span class="btn-text">Send Reset Link</span>
      </button>
    </form>
  </div>

  <!-- Step 2: set new password (arrived via reset link) -->
  <div id="step-newpw" style="display:none">
    <p style="color:var(--muted); font-size:0.875rem; margin-bottom:1.5rem;">
      Choose a strong password: 12+ characters, uppercase, number, and symbol.
    </p>
    <div id="alert-newpw" class="alert" style="display:none"></div>
    <form id="newpw-form" novalidate>
      <div class="form-group">
        <label for="new-password">New Password</label>
        <input type="password" id="new-password" name="password" autocomplete="new-password" placeholder="••••••••••••" required/>
        <div class="pw-strength">
          <div class="pw-strength-bar"><div class="pw-strength-fill" id="pw-fill"></div></div>
          <span class="pw-strength-label" id="pw-label"></span>
        </div>
        <div class="form-error" id="new-password-error"></div>
      </div>
      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" autocomplete="new-password" placeholder="••••••••••••" required/>
        <div class="form-error" id="confirm-password-error"></div>
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="btn-newpw">
        <span class="btn-spinner"></span>
        <span class="btn-text">Set New Password</span>
      </button>
    </form>
  </div>

  <div style="margin-top:1.5rem; text-align:center;">
    <a href="/login.html" style="font-size:0.8rem; color:var(--muted);">← Back to sign in</a>
  </div>
</div>

<script type="module">
import { supabase } from '/assets/supabase-client.js';
import { setBusy, showFieldError, clearAllErrors, checkPasswordStrength, updateStrengthBar } from '/assets/portal.js';

function showNewPasswordStep() {
  document.getElementById('step-request').style.display = 'none';
  document.getElementById('step-newpw').style.display   = 'block';
}

// Primary: listen for PASSWORD_RECOVERY auth event (Supabase v2 standard)
supabase.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') showNewPasswordStep();
});

// Fallback: detect recovery token in URL hash (older implicit flow)
const hash       = window.location.hash.replace('#', '');
const params     = new URLSearchParams(hash);
if (params.get('type') === 'recovery') showNewPasswordStep();

// ── Step 1: request reset ──
document.getElementById('request-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const alertEl = document.getElementById('alert-request');
  const btn     = document.getElementById('btn-request');
  clearAllErrors(e.target);
  alertEl.style.display = 'none';

  const email = e.target.email.value.trim();
  if (!email) { showFieldError('email', 'Email is required'); return; }

  setBusy(btn, true);
  const { error } = await supabase.auth.resetPasswordForEmail(email, {
    redirectTo: `${window.location.origin}/reset-password.html`,
  });
  setBusy(btn, false);

  if (error) {
    alertEl.className = 'alert alert-error';
    // Supabase rate-limit: "For security purposes, you can only request this after X seconds."
    const wait = error.message.match(/after (\d+) second/);
    alertEl.textContent = wait
      ? `Please wait ${wait[1]} seconds before requesting another link.`
      : error.message;
  } else {
    alertEl.className = 'alert alert-success';
    alertEl.textContent = 'Check your email - a reset link is on its way.';
    e.target.reset();
  }
  alertEl.style.display = 'block';
});

// ── Step 2: set new password ──
const pwInput = document.getElementById('new-password');
pwInput.addEventListener('input', () =>
  updateStrengthBar(document.getElementById('pw-fill'), document.getElementById('pw-label'), pwInput.value)
);

document.getElementById('newpw-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const alertEl = document.getElementById('alert-newpw');
  const btn     = document.getElementById('btn-newpw');
  clearAllErrors(e.target);
  alertEl.style.display = 'none';

  const password = pwInput.value;
  const confirm  = document.getElementById('confirm-password').value;
  let valid = true;

  if (checkPasswordStrength(password) < 3) {
    showFieldError('new-password', 'Password must be 12+ chars with uppercase, number, and symbol');
    valid = false;
  }
  if (password !== confirm) {
    showFieldError('confirm-password', 'Passwords do not match');
    valid = false;
  }
  if (!valid) return;

  setBusy(btn, true);
  const { error } = await supabase.auth.updateUser({ password });
  setBusy(btn, false);

  if (error) {
    alertEl.className = 'alert alert-error';
    alertEl.textContent = error.message;
    alertEl.style.display = 'block';
    return;
  }

  alertEl.className = 'alert alert-success';
  alertEl.textContent = 'Password updated! Redirecting...';
  alertEl.style.display = 'block';

  const { data: { session } } = await supabase.auth.getSession();
  const { data: profile } = await supabase
    .from('profiles').select('role').eq('id', session.user.id).single();
  const dest = profile?.role === 'admin' ? '/admin/dashboard.html' : '/dashboard.html';
  setTimeout(() => window.location.href = dest, 1500);
});
</script>
</body>
</html>
