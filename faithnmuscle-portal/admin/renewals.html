  <main class="portal-main">
    <div class="portal-topbar">

      <span class="topbar-title">Renewals</span>
    </div>
    <div class="portal-content" id="page-content" style="display:none;">

      <!-- Expiring soon -->
      <div class="card mb-3">
        <div class="card-header">
          <div>
            <div class="card-title">Expiring Soon</div>
            <div class="card-subtitle">Plans with an end date in the next <span id="window-days">14</span> days</div>
          </div>
          <select id="window-select" style="max-width:130px;">
            <option value="7">Next 7 days</option>
            <option value="14" selected>Next 14 days</option>
            <option value="30">Next 30 days</option>
          </select>
        </div>
        <div id="expiring-list"><div style="color:var(--muted); font-size:0.875rem;">Loading...</div></div>
      </div>

      <!-- Already expired (last 30 days) -->
      <div class="card">
        <div class="card-header"><div class="card-title">Recently Expired</div><div class="card-subtitle">Plans that expired in the last 30 days - status still active</div></div>
        <div id="expired-list"><div style="color:var(--muted); font-size:0.875rem;">Loading...</div></div>
      </div>

    </div>
  </main>
</div>

<script type="module">
import { supabase } from '/assets/supabase-client.js';
import { requireAuth, requireAdmin, initSidebar, escapeHtml, toast } from '/assets/portal.js';

const session = await requireAuth();
if (!session) throw new Error('unauthenticated');
await requireAdmin();
await initSidebar();

document.getElementById('page-content').style.display = 'block';

document.getElementById('window-select').addEventListener('change', (e) => {
  document.getElementById('window-days').textContent = e.target.value;
  loadExpiring();
});

await loadExpiring();
await loadExpired();

async function loadExpiring() {
  const days   = Number(document.getElementById('window-select').value);
  const today  = new Date().toISOString().split('T')[0];
  const future = new Date(Date.now() + days * 86400000).toISOString().split('T')[0];

  const { data } = await supabase
    .from('plans')
    .select('*, profiles(full_name, contact_phone)')
    .in('status', ['active', 'pending'])
    .gte('end_date', today)
    .lte('end_date', future)
    .order('end_date');

  const el = document.getElementById('expiring-list');
  if (!data?.length) {
    el.innerHTML = '<div style="color:var(--muted); font-size:0.875rem; padding:0.5rem 0;">No plans expiring in this window.</div>';
    return;
  }
  el.innerHTML = renderPlanTable(data);
}

async function loadExpired() {
  const today = new Date().toISOString().split('T')[0];
  const ago30 = new Date(Date.now() - 30 * 86400000).toISOString().split('T')[0];

  const { data } = await supabase
    .from('plans')
    .select('*, profiles(full_name, contact_phone)')
    .in('status', ['active', 'pending'])
    .lt('end_date', today)
    .gte('end_date', ago30)
    .order('end_date', { ascending: false });

  const el = document.getElementById('expired-list');
  if (!data?.length) {
    el.innerHTML = '<div style="color:var(--muted); font-size:0.875rem; padding:0.5rem 0;">No recently expired plans.</div>';
    return;
  }
  el.innerHTML = renderPlanTable(data, true);
}

function renderPlanTable(plans, isExpired = false) {
  const today = new Date().toISOString().split('T')[0];
  return `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Client</th><th>Plan</th><th>${isExpired ? 'Expired' : 'Expires'}</th><th>${isExpired ? '' : 'Days left'}</th><th>Phone</th><th>Actions</th></tr></thead>
        <tbody>
          ${plans.map(p => {
            const name    = p.profiles?.full_name || 'Unknown';
            const phone   = p.profiles?.contact_phone || '';
            const endDate = p.end_date || '-';
            const daysLeft = p.end_date ? Math.ceil((new Date(p.end_date) - new Date(today)) / 86400000) : null;
            const waLink  = phone
              ? 'https://wa.me/' + phone.replace(/[^0-9]/g, '') + '?text=' + encodeURIComponent(buildWaMessage(name, p.plan_type, endDate))
              : null;
            return `
              <tr>
                <td><a href="/admin/client-detail.html?id=${p.client_id}" style="color:var(--blue-light);">${escapeHtml(name)}</a></td>
                <td>${escapeHtml(formatPlanType(p.plan_type))}</td>
                <td>${escapeHtml(endDate)}</td>
                <td>${isExpired ? '' : (daysLeft !== null ? (daysLeft <= 3 ? `<span style="color:#ef4444; font-weight:600;">${daysLeft}d</span>` : `<span>${daysLeft}d</span>`) : '-')}</td>
                <td style="color:var(--muted); font-size:0.875rem;">${escapeHtml(phone || '-')}</td>
                <td>
                  ${waLink ? `<a href="${escapeHtml(waLink)}" target="_blank" rel="noopener" class="btn btn-secondary btn-sm">WhatsApp</a>` : '<span style="color:var(--muted); font-size:0.8rem;">No phone</span>'}
                </td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function formatPlanType(type) {
  const names = {
    coaching: '1-on-1 Coaching',
    workout:  'Workout Plan',
    meal:     'Meal Plan',
    athletes: 'Youth Athletes',
    rehab:    'Rehab & Flexibility',
  };
  return names[type] || type;
}

function buildWaMessage(name, planType, endDate) {
  const service = formatPlanType(planType);
  return `Hi ${name}! Your ${service} plan with Faith n Muscle ${endDate < new Date().toISOString().split('T')[0] ? 'expired on' : 'is expiring on'} ${endDate}. Would you like to renew? Feel free to let me know - Bernil 💪`;
}
</script>
