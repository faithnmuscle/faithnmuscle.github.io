<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In | Faith n Muscle Portal</title>
  <link rel="stylesheet" href="/assets/portal.css"/>
  <meta name="robots" content="noindex"/>
</head>
<body class="auth-page">

<div class="auth-card">
  <div class="auth-logo">
    <h1>Faith n Muscle</h1>
    <p>Member Portal</p>
  </div>

  <div id="alert" class="alert alert-error" style="display:none"></div>

  <form id="login-form" novalidate>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required/>
      <div class="form-error" id="email-error"></div>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••••••" required/>
      <div class="form-error" id="password-error"></div>
    </div>
    <div style="text-align:right; margin-top:-0.5rem; margin-bottom:1.25rem;">
      <a href="/reset-password.html" style="font-size:0.8rem; color:var(--muted);">Forgot password?</a>
    </div>
    <button type="submit" class="btn btn-primary btn-full btn-lg" id="btn-login">
      <span class="btn-spinner"></span>
      <span class="btn-text">Sign In</span>
    </button>
  </form>
</div>

<script type="module">
import { supabase } from '/assets/supabase-client.js';
import { setBusy, showFieldError, clearAllErrors } from '/assets/portal.js';

const form    = document.getElementById('login-form');
const alertEl = document.getElementById('alert');
const btn     = document.getElementById('btn-login');

// Synchronous hash check - runs before Supabase processes or clears the hash.
// If the root (/) redirected a recovery link here, forward to the right page.
const _hp = new URLSearchParams(window.location.hash.replace('#', ''));
if (_hp.get('type') === 'recovery') {
  window.location.replace('/reset-password.html' + window.location.hash);
}

// Already logged in - redirect to dashboard
const { data: { session } } = await supabase.auth.getSession();
if (session) await redirectByRole(session.user.id);

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearAllErrors(form);
  alertEl.style.display = 'none';

  const email    = form.email.value.trim();
  const password = form.password.value;

  let valid = true;
  if (!email)    { showFieldError('email',    'Email is required');    valid = false; }
  if (!password) { showFieldError('password', 'Password is required'); valid = false; }
  if (!valid) return;

  setBusy(btn, true);
  const { data, error } = await supabase.auth.signInWithPassword({ email, password });

  if (error) {
    setBusy(btn, false);
    alertEl.textContent = friendlyError(error.message);
    alertEl.style.display = 'block';
    return;
  }

  await redirectByRole(data.user.id);
});

async function redirectByRole(userId) {
  const { data: profile } = await supabase
    .from('profiles').select('role').eq('id', userId).single();
  window.location.href = profile?.role === 'admin'
    ? '/admin/dashboard.html'
    : '/dashboard.html';
}

function friendlyError(msg) {
  if (/invalid login/i.test(msg))        return 'Incorrect email or password.';
  if (/email not confirmed/i.test(msg))  return 'Please confirm your email before signing in.';
  if (/too many/i.test(msg))             return 'Too many attempts. Please wait a moment and try again.';
  return msg;
}
</script>
</body>
</html>
