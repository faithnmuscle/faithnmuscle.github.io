    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-avatar" id="sidebar-avatar">?</div>
        <div class="sidebar-user-info">

        </div>
      </div>
      <button class="btn-signout" id="btn-signout">Sign Out</button>

  <main class="portal-main">
    <div class="portal-topbar">
      <button class="sidebar-toggle" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="topbar-title">Profile</span>
      <div class="topbar-actions"></div>
    </div>

    <div class="portal-content" style="max-width:700px;">

      <!-- Personal details -->
      <div class="card mb-3">
        <div class="card-header">
          <div class="card-title">Personal Details</div>
        </div>
        <form id="profile-form" novalidate>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
            <div class="form-group">
              <label for="full_name">Full Name</label>
              <input type="text" id="full_name" name="full_name" placeholder="Your full name"/>
            </div>
            <div class="form-group">
              <label for="contact_phone">Phone / WhatsApp</label>
              <input type="tel" id="contact_phone" name="contact_phone" placeholder="+94 76 xxx xxxx"/>
            </div>
            <div class="form-group">
              <label for="age">Age</label>
              <input type="number" id="age" name="age" min="10" max="100" placeholder="25"/>
            </div>
            <div class="form-group">
              <label for="sex">Sex</label>
              <select id="sex" name="sex">
                <option value="">- select -</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="form-group">
              <label for="height_cm">Height (cm)</label>
              <input type="number" id="height_cm" name="height_cm" min="100" max="250" step="0.1" placeholder="175"/>
            </div>
            <div class="form-group">
              <label for="weight_kg">Current Weight (kg)</label>
              <input type="number" id="weight_kg" name="weight_kg" min="30" max="300" step="0.1" placeholder="70"/>
            </div>
            <div class="form-group">
              <label for="target_weight_kg">Target Weight (kg)</label>
              <input type="number" id="target_weight_kg" name="target_weight_kg" min="30" max="300" step="0.1" placeholder="65"/>
            </div>
            <div class="form-group">
              <label for="timezone">Timezone</label>
              <input type="text" id="timezone" name="timezone" placeholder="Asia/Colombo" readonly style="opacity:0.6; cursor:default;"/>
              <div class="form-hint">Detected automatically</div>
            </div>
          </div>
          <div id="profile-alert" class="alert" style="display:none; margin-top:0.5rem;"></div>
          <div style="display:flex; justify-content:flex-end; margin-top:0.5rem;">
            <button type="submit" class="btn btn-primary" id="btn-save-profile">
              <span class="btn-spinner"></span>
              <span class="btn-text">Save Changes</span>
            </button>
          </div>
        </form>
      </div>

      <!-- Change password -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">Change Password</div>
        </div>
        <form id="password-form" novalidate style="max-width:400px;">
          <div class="form-group">
            <label for="new-password">New Password</label>
            <input type="password" id="new-password" name="password" autocomplete="new-password" placeholder="••••••••••••"/>
            <div class="pw-strength">
              <div class="pw-strength-bar"><div class="pw-strength-fill" id="pw-fill"></div></div>
              <span class="pw-strength-label" id="pw-label"></span>
            </div>
            <div class="form-error" id="new-password-error"></div>
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" name="confirm" autocomplete="new-password" placeholder="••••••••••••"/>
            <div class="form-error" id="confirm-password-error"></div>
          </div>
          <div id="pw-alert" class="alert" style="display:none;"></div>
          <button type="submit" class="btn btn-primary" id="btn-save-pw">
            <span class="btn-spinner"></span>
            <span class="btn-text">Update Password</span>
          </button>
        </form>
      </div>

    </div>
  </main>
</div>

<script type="module">
import { supabase } from '/assets/supabase-client.js';
import {
  requireAuth, initSidebar, getProfile,
  setBusy, showFieldError, clearAllErrors,
  checkPasswordStrength, updateStrengthBar, toast
} from '/assets/portal.js';

const session = await requireAuth();
if (!session) throw new Error('not authenticated');
await initSidebar();
const profile = await getProfile();

// Populate form
const fields = ['full_name','contact_phone','age','sex','height_cm','weight_kg','target_weight_kg','timezone'];
fields.forEach(f => {
  const el = document.getElementById(f);
  if (el && profile[f] != null) el.value = profile[f];
});

// ── Save profile ──
const profileForm  = document.getElementById('profile-form');
const profileAlert = document.getElementById('profile-alert');
const btnSave      = document.getElementById('btn-save-profile');

profileForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  profileAlert.style.display = 'none';
  setBusy(btnSave, true);

  const updates = {};
  fields.filter(f => f !== 'timezone').forEach(f => {
    const el = document.getElementById(f);
    if (!el) return;
    const v = el.value.trim();
    updates[f] = v === '' ? null : (['age','height_cm','weight_kg','target_weight_kg'].includes(f) ? Number(v) : v);
  });
  updates.updated_at = new Date().toISOString();

  const { error } = await supabase.from('profiles').update(updates).eq('id', profile.id);
  setBusy(btnSave, false);

  if (error) {
    profileAlert.className = 'alert alert-error';
    profileAlert.textContent = error.message;
    profileAlert.style.display = 'block';
  } else {
    profileAlert.className = 'alert alert-success';
    profileAlert.textContent = 'Profile saved.';
    profileAlert.style.display = 'block';
    setTimeout(() => profileAlert.style.display = 'none', 3000);
  }
});

// ── Change password ──
const pwForm  = document.getElementById('password-form');
const pwAlert = document.getElementById('pw-alert');
const btnPw   = document.getElementById('btn-save-pw');
const pwInput = document.getElementById('new-password');

pwInput.addEventListener('input', () =>
  updateStrengthBar(document.getElementById('pw-fill'), document.getElementById('pw-label'), pwInput.value)
);

pwForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearAllErrors(pwForm);
  pwAlert.style.display = 'none';

  const password = pwInput.value;
  const confirm  = document.getElementById('confirm-password').value;
  let valid = true;

  if (checkPasswordStrength(password) < 3) {
    showFieldError('new-password', 'Password must be 12+ chars with uppercase, number, and symbol');
    valid = false;
  }
  if (password !== confirm) {
    showFieldError('confirm-password', 'Passwords do not match');
    valid = false;
  }
  if (!valid) return;

  setBusy(btnPw, true);
  const { error } = await supabase.auth.updateUser({ password });
  setBusy(btnPw, false);

  if (error) {
    pwAlert.className = 'alert alert-error';
    pwAlert.textContent = error.message;
    pwAlert.style.display = 'block';
  } else {
    pwForm.reset();
    document.getElementById('pw-fill').style.width = '0';
    document.getElementById('pw-label').textContent = '';
    pwAlert.className = 'alert alert-success';
    pwAlert.textContent = 'Password updated successfully.';
    pwAlert.style.display = 'block';
    setTimeout(() => pwAlert.style.display = 'none', 4000);
  }
});
</script>
</body>
