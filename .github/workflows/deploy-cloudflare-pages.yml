# GitHub only runs workflows from the repo root .github/workflows/.
# Deploys faithnmuscle-portal/ to Cloudflare Pages (project: faithnmuscle-portal).

name: Deploy portal to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'faithnmuscle-portal/**'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: faithnmuscle-portal

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest pages deploy . --project-name faithnmuscle-portal --branch main --commit-dirty=true
